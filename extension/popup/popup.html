<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nox-Safe</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      background: #171e19;
      font-family: 'DM Sans', sans-serif;
      overflow-x: hidden;
    }

    /* ── Header ── */
    .header {
      background: #ffe17c;
      border-bottom: 2px solid #000;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-logo {
      width: 30px;
      height: 30px;
      background: #000;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .header h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: 17px;
      color: #000;
    }

    .oracle-badge {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: #000;
      background: rgba(0,0,0,0.12);
      border-radius: 100px;
      padding: 3px 9px;
      border: 1.5px solid rgba(0,0,0,0.2);
    }

    .oracle-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: 1.5px solid rgba(0,0,0,0.3);
    }

    .oracle-dot.active   { background: #4ade80; }
    .oracle-dot.offline  { background: #f59e0b; animation: pulse 1.5s infinite; }
    .oracle-dot.loading  { background: #d1d5db; animation: pulse 1.5s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ── Product cards ── */
    .products-section {
      padding: 14px 16px;
      border-bottom: 2px solid #222;
    }

    .products-label {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 10px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 10px;
    }

    .product-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 13px;
      border-radius: 10px;
      border: 2px solid #2a2a2a;
      background: #1e2620;
      cursor: pointer;
      text-decoration: none;
      transition: border-color 0.15s ease, background 0.15s ease;
      margin-bottom: 8px;
    }

    .product-card:last-child { margin-bottom: 0; }

    .product-card:hover {
      border-color: #444;
      background: #242e26;
    }

    .product-card-icon {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1.5px solid rgba(0,0,0,0.4);
    }

    .product-card-icon.safe { background: #ffe17c; }
    .product-card-icon.pay  { background: #8fb88b; }

    .product-card-body { flex: 1; min-width: 0; }

    .product-card-name {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 13px;
      color: #fff;
      margin-bottom: 2px;
    }

    .product-card-desc {
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .product-card-arrow {
      font-size: 14px;
      color: #444;
      flex-shrink: 0;
    }

    /* ── Safe dashboard (existing) ── */
    .safe-card {
      background: #ffe17c;
      border: 2px solid #000;
      border-radius: 12px;
      padding: 12px 14px;
      box-shadow: 4px 4px 0px 0px #000;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .safe-card .safe-icon {
      width: 32px;
      height: 32px;
      background: #000;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .safe-card .safe-info { flex: 1; min-width: 0; }

    .safe-card .safe-label {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 11px;
      color: #000;
      opacity: 0.55;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .safe-card .safe-addr {
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      color: #000;
    }

    .module-badge {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 10px;
      border: 1.5px solid #000;
      border-radius: 100px;
      padding: 2px 8px;
      flex-shrink: 0;
    }

    .module-badge.enabled  { background: #4ade80; color: #000; }
    .module-badge.disabled { background: #f87171; color: #fff; }

    /* Content */
    .content { padding: 16px; }

    /* Spending bar */
    .spend-card {
      background: #222;
      border: 2px solid #333;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }

    .spend-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .spend-title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 12px;
      color: #b7c6c2;
    }

    .spend-amount {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: #ffe17c;
    }

    .spend-bar-track {
      height: 10px;
      background: #333;
      border-radius: 100px;
      overflow: hidden;
      border: 1.5px solid #444;
    }

    .spend-bar-fill {
      height: 100%;
      border-radius: 100px;
      transition: width 0.6s ease;
    }

    .spend-bar-fill.green  { background: #4ade80; }
    .spend-bar-fill.orange { background: #f59e0b; }
    .spend-bar-fill.red    { background: #f87171; }

    .spend-footer {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: #555;
    }

    /* Policy stats */
    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .stat-box {
      background: #222;
      border: 2px solid #333;
      border-radius: 10px;
      padding: 10px 12px;
    }

    .stat-label {
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      color: #777;
      margin-bottom: 4px;
    }

    .stat-value {
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      color: #ffe17c;
      font-weight: 500;
    }

    /* Setup state */
    .setup-card {
      background: #222;
      border: 2px solid #333;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .setup-title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 14px;
      color: #ffe17c;
      margin-bottom: 6px;
    }

    .setup-desc {
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      color: #b7c6c2;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .nox-input-dark {
      width: 100%;
      padding: 10px 12px;
      background: #111;
      border: 2px solid #444;
      border-radius: 8px;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: #ffe17c;
      outline: none;
      margin-bottom: 10px;
    }

    .nox-input-dark::placeholder { color: #555; }
    .nox-input-dark:focus { border-color: #ffe17c; }

    /* Buttons */
    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      background: #ffe17c;
      color: #000;
      border: 2px solid #000;
      border-radius: 10px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 4px 4px 0px 0px #000;
      transition: all 0.2s ease;
      margin-bottom: 8px;
    }

    .btn-primary:hover {
      transform: translate(4px, 4px);
      box-shadow: 0 0 0 0 #000;
    }

    .btn-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 10px;
      background: #fff;
      color: #000;
      border: 2px solid #444;
      border-radius: 10px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 3px 3px 0px 0px #444;
      transition: all 0.2s ease;
      margin-bottom: 8px;
    }

    .btn-secondary:hover {
      transform: translate(3px, 3px);
      box-shadow: 0 0 0 0 #444;
    }

    .btn-ghost {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 8px;
      background: transparent;
      color: #555;
      border: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      cursor: pointer;
    }

    .btn-ghost:hover { color: #b7c6c2; }

    /* Loading spinner */
    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid #333;
      border-top-color: #ffe17c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: #555;
      text-align: center;
      margin-bottom: 16px;
    }

    /* Error */
    .error-text {
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      color: #f87171;
      text-align: center;
      margin-bottom: 12px;
    }

    /* Footer */
    .footer {
      padding: 10px 16px;
      border-top: 2px solid #222;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-text {
      font-family: 'DM Sans', sans-serif;
      font-size: 10px;
      color: #444;
    }

    .change-safe {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: #555;
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: underline;
    }

    .change-safe:hover { color: #ffe17c; }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="header-logo">
      <svg width="15" height="15" viewBox="0 0 32 32" fill="none">
        <path d="M16 2L4 8v8c0 7.4 5.12 14.32 12 16 6.88-1.68 12-8.6 12-16V8L16 2z" fill="#ffe17c" stroke="#ffe17c" stroke-width="1"/>
        <path d="M16 9l1.8 3.6H22l-3.4 2.5 1.3 4L16 16.6 12.1 19.1l1.3-4L10 12.6h4.2L16 9z" fill="#000"/>
      </svg>
    </div>
    <h1>Nox-Safe</h1>
    <div class="oracle-badge" id="oracle-badge">
      <div class="oracle-dot loading" id="oracle-dot"></div>
      <span id="oracle-text">Oracle…</span>
    </div>
  </div>

  <!-- Product selection -->
  <div class="products-section">
    <div class="products-label">Products</div>

    <a class="product-card" id="safe-product-card" href="#" target="_blank" rel="noopener noreferrer">
      <div class="product-card-icon safe">
        <svg width="16" height="16" viewBox="0 0 32 32" fill="none">
          <path d="M16 2L4 8v8c0 7.4 5.12 14.32 12 16 6.88-1.68 12-8.6 12-16V8L16 2z" fill="#000"/>
          <path d="M16 9l1.8 3.6H22l-3.4 2.5 1.3 4L16 16.6 12.1 19.1l1.3-4L10 12.6h4.2L16 9z" fill="#ffe17c"/>
        </svg>
      </div>
      <div class="product-card-body">
        <div class="product-card-name">NOX-SAFE</div>
        <div class="product-card-desc">Confidential treasury execution for Safe multisig</div>
      </div>
      <div class="product-card-arrow">→</div>
    </a>

    <a class="product-card" id="noxpay-product-card" href="#" target="_blank" rel="noopener noreferrer">
      <div class="product-card-icon pay">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9" stroke="#000" stroke-width="2.5"/>
          <path d="M9 12h6M12 9v6" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="product-card-body">
        <div class="product-card-name">NOXPAY</div>
        <div class="product-card-desc">Confidential payroll streaming on Sablier</div>
      </div>
      <div class="product-card-arrow">→</div>
    </a>
  </div>

  <!-- Nox-Safe dashboard (Safe-specific data) -->
  <div class="content" id="main-content">
    <div class="spinner"></div>
    <p class="loading-text">Loading…</p>
  </div>

  <!-- Footer -->
  <div class="footer">
    <span class="footer-text">Nox-Safe Extension · Sepolia</span>
    <button class="change-safe" id="change-safe-btn" style="display:none;">Change Safe</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
